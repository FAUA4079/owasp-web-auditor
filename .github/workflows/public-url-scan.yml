name: Scan GitHub Pages public demo URL
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out OWASP Web Auditor
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the scanner
        run: python -m pip install -e .
      - name: Confirm public website is reachable
        run: |
          curl --fail --location --silent --show-error --retry 2 --retry-delay 2             https://faua4079.github.io/owasp-web-auditor/ > /dev/null
      - name: Scan hosted root for supported response/transport observations
        run: |
          python -m auditor --url https://faua4079.github.io/owasp-web-auditor/             --no-crawl --checks CHK01,CHK02,CHK03,CHK04 --output runs/hosted
      - name: Scan static fake traceback for CHK05
        run: |
          python -m auditor --url https://faua4079.github.io/owasp-web-auditor/error.html             --no-crawl --checks CHK05 --output runs/hosted
      - name: Scan static listing for CHK06
        run: |
          python -m auditor --url https://faua4079.github.io/owasp-web-auditor/listing/             --no-crawl --checks CHK06 --output runs/hosted
      - name: Print findings and assert fixture patterns
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              '/error.html': ('CHK05','Potential'),
              '/listing/': ('CHK06','Potential'),
          }
          seen = {}
          files = sorted(Path('runs/hosted').glob('scan-*/results/tests.json'))
          if len(files) < 3:
              raise SystemExit('Expected three separate scanner result sets')
          for file in files:
              rows = json.loads(file.read_text(encoding='utf-8'))
              for row in rows:
                  rid = row.get('rule_id')
                  status = row.get('status')
                  endpoint = row.get('endpoint','')
                  print(f'{rid}: {status} ({endpoint})')
                  for suffix,(check,wanted) in expected.items():
                      if endpoint.endswith(suffix) and rid == check:
                          seen[suffix] = status
          for suffix,(check,wanted) in expected.items():
              if seen.get(suffix) != wanted:
                  raise SystemExit(f'{check} expected {wanted}, got {seen.get(suffix)!r}')
          print('PASS: CHK05 and CHK06 matched their synthetic hosted fixtures.')
          print('Other checks reflect GitHub-controlled production headers.')
          print('GitHub Pages cannot run CHK07-CHK13 backend scenarios.')
          PY
      - name: Save HTTP scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owa-public-url-reports
          path: runs/hosted/
          if-no-files-found: warn
